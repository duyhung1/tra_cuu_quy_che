[project]
name = "tra-cuu-quy-che"
version = "0.1.0"
description = "Tra cứu quy chế nội bộ có căn cứ Điều/Khoản"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5,<1"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["sdlc-kit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
